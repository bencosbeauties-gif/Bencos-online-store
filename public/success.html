<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | Benco's</title><link rel="stylesheet" href="styles.css"></head><body><main style="max-width:700px;margin:80px auto;padding:30px;text-align:center;background:#fff;border-radius:24px"><img src="assets/bencos-logo.jpg" style="height:90px"><h1 style="font-family:Georgia,serif">Thank you for your order!</h1><p id="status">Verifying your payment...</p><a class="primary" href="/">Back to shop</a></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('session_id');if(!id)return;try{const r=await fetch('/api/checkout-status?session_id='+encodeURIComponent(id));const d=await r.json();document.getElementById('status').textContent=d.payment_status==='paid'?`Payment received. A confirmation will be sent to ${d.customer_email||'your email'}.`:'Your order was created, but payment is not marked paid yet.';if(d.payment_status==='paid')localStorage.removeItem('bencosCart')}catch(e){document.getElementById('status').textContent='Your order was submitted. Please check your email for confirmation.'}})();
</script></body></html>
